apiVersion: v1
kind: ConfigMap
metadata:
  name: car-repair-billing-service-config
  labels:
    app.kubernetes.io/name: car-repair-billing-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: car-repair
# Só configuração não sigilosa. Senhas vêm dos Secrets criados por
# car-repair-k8s-infra/scripts/academy-bootstrap-platform.sh.
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__HostName: "rabbitmq"
  # Fake (padrão) ou MercadoPago. Com MercadoPago, o token vem do Secret billing-mercadopago.
  PaymentGateway__Provider: "Fake"
  # URL pública do webhook pelo Kong: http://<NLB do Kong>/api/payments/webhooks/mercadopago
  MercadoPago__NotificationUrl: ""
  # New Relic APM (agente .NET na imagem). A license vem do Secret newrelic-license;
  # sem ele o agente fica sem enviar dados e o serviço segue normal.
  CORECLR_ENABLE_PROFILING: "1"
  NEW_RELIC_APP_NAME: "car-repair-billing-service"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_LABELS: "project:car-repair-shop;phase:4;service:billing-service"
