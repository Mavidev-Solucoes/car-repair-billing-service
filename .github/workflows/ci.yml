name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: Restore, Build, Test, Coverage, Sonar and Docker Validation
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect SonarCloud availability
        id: sonar-config
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_PROJECT_KEY" ] && [ -n "$SONAR_ORGANIZATION" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17 for Sonar
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Install SonarScanner for .NET
        if: steps.sonar-config.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: 1. Restore
        run: dotnet restore ${{ github.workspace }}/CarRepairBillingService.sln

      - name: SonarQube Begin
        if: steps.sonar-config.outputs.enabled == 'true'
        run: |
          ~/.dotnet/tools/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/Coverage/raw/*.opencover.xml" \
            /s:"$GITHUB_WORKSPACE/sonar-project.properties"

      - name: 2. Build
        run: dotnet build ${{ github.workspace }}/CarRepairBillingService.sln --configuration Release --no-restore

      - name: Discover test projects
        id: discover-tests
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find ${{ github.workspace }} -type f -name "*.csproj" | sort | while IFS= read -r project; do
              if grep -Eq '<IsTestProject>true</IsTestProject>|<PackageReference Include="Microsoft.NET.Test.Sdk"|<PackageReference Include="xunit"|<PackageReference Include="NUnit"|<PackageReference Include="MSTest\.TestFramework"' "$project"; then
                echo "$project"
              fi
            done
          )

          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "No test projects found. Ensure test projects define IsTestProject=true or reference a supported test SDK/package."
            exit 1
          fi

          printf '%s\n' "${test_projects[@]}" > ${{ github.workspace }}/test-projects.txt

      - name: 3. Unit Tests
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/TestResults/Coverage/raw

          while IFS= read -r project; do
            project_name=$(basename "$project" .csproj)
            echo "Running unit tests with coverage for $project"

            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --verbosity normal \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput="${{ github.workspace }}/TestResults/Coverage/raw/${project_name}.opencover.xml"
          done < ${{ github.workspace }}/test-projects.txt

      - name: 4. Generate Code Coverage
        shell: bash
        run: |
          shopt -s nullglob
          reports=(${{ github.workspace }}/TestResults/Coverage/raw/*.opencover.xml)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "Coverage reports were not generated. Ensure test projects include Coverlet integration."
            exit 1
          fi

          ~/.dotnet/tools/reportgenerator \
            "-reports:${{ github.workspace }}/TestResults/Coverage/raw/*.opencover.xml" \
            "-targetdir:${{ github.workspace }}/TestResults/Coverage/report" \
            "-reporttypes:TextSummary;Cobertura"

          summary_file="${{ github.workspace }}/TestResults/Coverage/report/Summary.txt"
          if [ ! -f "$summary_file" ]; then
            echo "Coverage summary file was not generated."
            exit 1
          fi

          line_coverage=$(grep -E '^Line coverage:' "$summary_file" | sed -E 's/.*: ([0-9]+(\.[0-9]+)?)%.*/\1/' | head -n 1)

          if [ -z "$line_coverage" ]; then
            echo "Unable to parse line coverage from Summary.txt"
            cat "$summary_file"
            exit 1
          fi

          echo "Line coverage: ${line_coverage}%"

          awk -v coverage="$line_coverage" 'BEGIN { if (coverage + 0 < 80) { exit 1 } }' || {
            echo "Code coverage threshold not met. Required: 80%, current: ${line_coverage}%"
            exit 1
          }

      - name: 5. SonarQube Analysis
        if: steps.sonar-config.outputs.enabled == 'true'
        run: ~/.dotnet/tools/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: 5.1 Sonar Quality Gate
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        timeout-minutes: 10
        with:
          scanMetadataReportFile: ${{ github.workspace }}/.sonarqube/out/.sonar/report-task.txt

      - name: SonarQube skipped notice
        if: steps.sonar-config.outputs.enabled != 'true'
        run: echo "SonarQube analysis skipped because required SonarCloud secrets are not configured in this context."

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 6. Docker Build Validation
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/src/Api/Dockerfile
          push: false
          tags: car-repair-billing-service:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
